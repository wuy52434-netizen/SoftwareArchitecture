name: CI

on:
  push:
    branches: [master, main, mh1, mh2, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------- 1. 后端构建 + 单测 + 覆盖率门禁
  backend:
    name: 后端构建 / 单元测试 / 覆盖率门禁
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 构建 + 单元测试 + JaCoCo 覆盖率门禁
        working-directory: backend
        # verify 阶段会执行 jacoco:check，行覆盖率低于模块阈值直接让流水线失败
        run: mvn -B -ntp clean verify

      - name: 汇总各模块覆盖率
        run: |
          python3 test/tools/coverage_summary.py --markdown | tee coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 归档 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: backend/*/target/site/jacoco/
          retention-days: 14

      - name: 归档单元测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/*/target/surefire-reports/
          retention-days: 14

  # ---------------------------------------------------------------- 2. 测试工程静态校验（快速信号）
  python-suites:
    name: 测试工程校验（用例可收集）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装各测试套件依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r test/api/requirements.txt
          pip install -r test/contract/requirements.txt
          pip install -r test/mq/requirements.txt
          pip install -r test/search/requirements.txt
          pip install -r test/e2e/requirements.txt

      # 只是"能否收集"的快速信号，真正的执行在下面的 integration 作业
      - name: 校验各套件用例可收集
        run: |
          for suite in api contract mq search e2e; do
            echo "--- $suite ---"
            (cd "test/$suite" && pytest --collect-only -q) || exit 1
          done

  # ---------------------------------------------------------------- 3. 全栈集成测试（真实执行）
  integration:
    name: 全栈集成 / 接口 / 契约 / MQ / ES / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, python-suites]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r test/api/requirements.txt
          pip install -r test/contract/requirements.txt
          pip install -r test/mq/requirements.txt
          pip install -r test/search/requirements.txt
          pip install -r test/e2e/requirements.txt

      - name: 安装 Playwright 浏览器（E2E 需要）
        run: python -m playwright install --with-deps chromium

      - name: 构建后端产物
        # Dockerfile 是 COPY */target/*.jar，依赖宿主机先打好 jar
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: 构建前端产物
        # nginx 挂载 frontend/dist；E2E 选择器 data-testid 必须在构建产物里
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 跑全栈测试（脚本内负责起容器、等就绪、灌索引、执行各套件）
        # 任何一个套件失败都会让这一步失败 —— 没有 `|| true`，不做"看起来绿"
        env:
          LIB_TEST_PYTHON: python3
        run: bash test/scripts/run_all_tests.sh api contract mq search e2e

      - name: 导出 Docker 容器日志（失败时排查用）
        if: failure()
        run: |
          mkdir -p docker-logs
          for c in $(docker ps -a --format '{{.Names}}' | grep '^library-'); do
            docker logs "$c" > "docker-logs/${c}.log" 2>&1 || true
          done

      - name: 归档测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: |
            test/api/report-ci.html
            test/contract/report-ci.html
            test/mq/report-ci.html
            test/search/report-ci.html
            test/e2e/report-ci.html
            docker-logs/
          retention-days: 14
