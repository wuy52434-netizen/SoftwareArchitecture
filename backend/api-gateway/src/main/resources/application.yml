server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: api-gateway

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_SERVER:localhost:8858}
        port: 8719
      eager: true

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/api/users/**,/api/auth/**,/api/settings/**
          filters:
            - StripPrefix=0

        - id: book-service
          uri: ${BOOK_SERVICE_URL:lb://book-service}
          predicates:
            - Path=/api/books/**,/api/categories/**
          filters:
            - StripPrefix=0

        - id: borrow-service
          uri: ${BORROW_SERVICE_URL:lb://borrow-service}
          predicates:
            - Path=/api/borrows/**,/api/borrow/**,/api/return/**,/api/my-borrows/**,/api/borrow-records/**
          filters:
            - StripPrefix=0

        - id: search-service
          uri: ${SEARCH_SERVICE_URL:lb://search-service}
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=0

        - id: stats-service
          uri: ${STATS_SERVICE_URL:lb://stats-service}
          predicates:
            - Path=/api/stats/**
          filters:
            - StripPrefix=0

        - id: notify-service
          uri: ${NOTIFY_SERVICE_URL:lb://notify-service}
          predicates:
            - Path=/api/notify/**
          filters:
            - StripPrefix=0

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

jwt:
  secret: ${JWT_SECRET:library-management-system-jwt-secret-key-2024}
  access-token-expire: 7200000
  refresh-token-expire: 604800000

auth-filter:
  # 白名单条目格式（见 JwtAuthenticationFilter#isWhiteList）：
  #   "METHOD /path" —— 仅该 HTTP 方法匿名放行（推荐，必须用这种）
  #   "/path"        —— 任意方法匿名放行（历史写法，仅为兼容保留，不要新增）
  #
  # 原实现只比路径不比方法，于是 /api/settings 一进白名单，连 PUT 也免鉴权，
  # 匿名调用方即可改借阅天数与罚款标准（缺陷 KNWN-SEC-02）。此处按方法收权：
  # 只读接口匿名、写接口一律走鉴权。
  whiteList:
    # ---- 鉴权入口：未登录就必须能调，否则无法登录
    - POST /api/auth/login
    - POST /api/auth/register
    - POST /api/auth/refresh
    # ---- 只读资源：借书机终端自助浏览与门户列表需要匿名读
    - GET /api/books
    - GET /api/books/**
    - GET /api/categories/**
    - GET /api/search
    - GET /api/search/**
    # 借书机「归还」页与门户页面启动时要读借阅规则，属只读；
    # 但 PUT /api/settings（改规则）必须鉴权 —— 这是本次收敛的关键一条
    - GET /api/settings
    - GET /api/settings/**
    - GET /api/borrow-records/**
    - GET /api/users/card/**
    - GET /error
    # ---- 借书机终端写操作：刷读者卡自助借还，身份由卡号决定，因此匿名放行属产品设计
    - POST /api/borrow
    - POST /api/borrow/**
    - POST /api/return
    - POST /api/return/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.library: DEBUG
    org.springframework.cloud.gateway: DEBUG
    com.alibaba.csp.sentinel: info
